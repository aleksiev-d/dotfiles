# Mirrors the iTerm2 setup: Hack Nerd Font Mono 18.

font_family      Hack Nerd Font Mono
font_size        18.0
macos_option_as_alt yes

window_padding_width 12
hide_window_decorations titlebar-only


# BEGIN_KITTY_THEME
# Everforest Dark Soft
include current-theme.conf
# END_KITTY_THEME
background_opacity 0.9
background_blur 24

# Readable selection: dark everforest green bg, light fg (theme's default washes out over blur)
selection_background #425047
selection_foreground #d3c6aa
