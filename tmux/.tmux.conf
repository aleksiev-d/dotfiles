# Keep default prefix Ctrl-b
set -g prefix C-b
bind C-b send-prefix

# Truecolor (so neovim Solarized Light renders, not degraded to dark)
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Start windows/panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Toggle popup terminal (Alt+~)
bind -n M-` if-shell -F '#{==:#{session_name},popup-0}' 'detach-client' 'display-popup -E -w 100% -h 40% -y S -d "#{pane_current_path}" "tmux new-session -A -s popup-0"'

# Alt + number to switch windows (no prefix needed)
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Clipboard: relay OSC 52 from programs (incl. remote ssh sessions) up to kitty,
# and let tmux write the clipboard itself when copying in copy mode.
set -g set-clipboard on
set -g allow-passthrough on
